<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Deep Dive</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #1a1a1a;
        background: #fafafa;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 600;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      label.field {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        color: #404040;
      }
      textarea {
        width: 100%;
        min-height: 88px;
        padding: 8px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        font: inherit;
        resize: vertical;
      }
      textarea:focus {
        outline: 2px solid #6366f1;
        border-color: transparent;
      }
      .hint {
        margin: 6px 0 0;
        font-size: 11px;
        color: #737373;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #16a34a;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>ChatGPT Deep Dive</h1>
    <label class="row">
      <input type="checkbox" id="enabled" checked />
      <span>Enabled on ChatGPT</span>
    </label>
    <label class="field" for="template">Prompt template</label>
    <textarea
      id="template"
      spellcheck="true"
      placeholder='Use {term} for the selected text.'
    ></textarea>
    <p class="hint">Select text on chatgpt.com, click Deep dive, edit the prompt, then open a new chat.</p>
    <p class="status" id="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
